name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Compile Python files
        run: python -m py_compile main.py dashboard.py src/*.py tests/*.py

      - name: Run pipeline smoke test
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          # A temporary input avoids main.py writing its fallback CSV into the checkout.
          cat > "$temp_dir/input.csv" <<'CSV'
          response_id,response_date,question,option,region,age_group,gender,satisfaction_score
          R001,2024-01-01,Preferred Study Format,Hybrid,West,18-24,Female,7
          R002,2024-01-02,Campus Event Interest,Somewhat interested,East,25-34,Male,6
          R003,2024-01-03,Best Study Time,Afternoon,North,18-24,Female,8
          CSV
          python main.py --rows 25 --seed 42 \
            --output-dir "$temp_dir/outputs" \
            --image-dir "$temp_dir/images" \
            --input "$temp_dir/input.csv"
